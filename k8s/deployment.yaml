
apiVersion: apps/v1
kind: Deployment

metadata:
  name: trend-app
  labels:
    app: trend-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: trend-app

  template:
    metadata:
      labels:
        app: trend-app

    spec:
      containers:
        - name: trend-app
          image: karthikops/trend-app:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              name: http
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
